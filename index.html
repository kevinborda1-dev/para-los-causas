<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preguntas Divertidas</title>
    <!-- Librería externa para el efecto de serpentinas y confeti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            text-align: center;
        }

        .card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            max-width: 480px;
            width: 90%;
            position: relative;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 2rem;
        }

        .botones {
            display: flex;
            gap: 20px;
            justify-content: center;
            align-items: center;
            min-height: 80px;
            position: relative;
        }

        button {
            padding: 12px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: background-color 0.2s;
        }

        .btn-si {
            background-color: #2ecc71;
            color: white;
        }

        .btn-si:hover {
            background-color: #27ae60;
        }

        .btn-no {
            background-color: #e74c3c;
            color: white;
        }

        .btn-no:hover {
            background-color: #c0392b;
        }

        /* Clase para los botones que se escapan */
        .escapista {
            position: absolute !important;
            transition: all 0.1s ease-out;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- PREGUNTA 1 -->
        <div id="seccion1">
            <h1>¿Eres gay?</h1>
            <div class="botones" id="contenedor1">
                <button class="btn-si" id="btnSi1">SÍ</button>
                <button class="btn-no" id="btnNo1">NO</button>
            </div>
        </div>

        <!-- PREGUNTA 2 -->
        <div id="seccion2" class="hidden">
            <h1>¿Y tu familia lo sabe?</h1>
            <div class="botones" id="contenedor2">
                <button class="btn-si" id="btnSi2">SÍ</button>
                <button class="btn-no" id="btnNo2">NO</button>
            </div>
        </div>

        <!-- SECCIÓN FINAL -->
        <div id="seccionFinal" class="hidden">
            <h1 style="color: #27ae60; font-size: 2.2rem;">¡Felicidades saliste del closet!</h1>
            <button class="btn-si" onclick="location.reload()" style="margin-top: 20px;">Volver a jugar</button>
        </div>
    </div>

    <script>
        // Función genérica para hacer que cualquier botón se escape
        function hacerEscapista(idBoton, callbackAlDarClick) {
            const btn = document.getElementById(idBoton);

            function mover(e) {
                if (e) e.preventDefault();
                const ancho = window.innerWidth - btn.offsetWidth - 40;
                const alto = window.innerHeight - btn.offsetHeight - 40;
                const randomX = Math.random() * ancho;
                const randomY = Math.random() * alto;

                btn.classList.add('escapista');
                btn.style.left = `${randomX}px`;
                btn.style.top = `${randomY}px`;
            }

            btn.addEventListener('mouseover', mover);
            btn.addEventListener('touchstart', mover);

            // Por si milagrosamente logran hacerle clic/touch directo
            if (callbackAlDarClick) {
                btn.addEventListener('click', callbackAlDarClick);
            }
        }

        // --- CONFIGURACIÓN PREGUNTA 1 (Ambos se escapan, el SÍ avanza a la siguiente pregunta) ---
        hacerEscapista('btnSi1', siguientePregunta);
        hacerEscapista('btnNo1', siguientePregunta); // Si logran darle al No, también avanza por diversión

        // --- TRANSICIÓN A LA SEGUNDA PREGUNTA ---
        function siguientePregunta() {
            document.getElementById('seccion1').classList.add('hidden');
            document.getElementById('seccion2').classList.remove('hidden');
            
            // --- CONFIGURACIÓN PREGUNTA 2 (Ambos se escapan, el NO activa el final) ---
            hacerEscapista('btnSi2', finalizar);
            hacerEscapista('btnNo2', finalizar);
        }

        // --- FINALIZACIÓN Y LANZAMIENTO DE SERPENTINAS ---
        function finalizar() {
            document.getElementById('seccion2').classList.add('hidden');
            document.getElementById('seccionFinal').classList.remove('hidden');

            // Lanzamiento de serpentinas y confeti masivo desde los costados
            var duration = 3.5 * 1000;
            var end = Date.now() + duration;

            (function frame() {
                confetti({
                    particleCount: 5,
                    angle: 60,
                    spread: 55,
                    origin: { x: 0 }
                });
                confetti({
                    particleCount: 5,
                    angle: 120,
                    spread: 55,
                    origin: { x: 1 }
                });

                if (Date.now() < end) {
                    requestAnimationFrame(frame);
                }
            }());
        }
    </script>

</body>
</html>
