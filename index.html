<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preguntas Divertidas</title>
    <!-- Librería externa para el efecto de serpentinas y confeti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            text-align: center;
        }

        .card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            max-width: 480px;
            width: 90%;
            position: relative;
            z-index: 10;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 2rem;
        }

        .botones {
            display: flex;
            gap: 20px;
            justify-content: center;
            align-items: center;
            min-height: 80px;
            position: relative;
        }

        button {
            padding: 12px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: background-color 0.2s;
        }

        .btn-si {
            background-color: #2ecc71;
            color: white;
        }

        .btn-si:hover {
            background-color: #27ae60;
        }

        .btn-no {
            background-color: #e74c3c;
            color: white;
        }

        .btn-no:hover {
            background-color: #c0392b;
        }

        /* Clase para el botón que se escapa libremente por la pantalla */
        .escapista {
            position: fixed !important;
            transition: all 0.1s ease-out;
            z-index: 1000;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- PREGUNTA 1 -->
        <div id="seccion1">
            <h1>¿Eres gay?</h1>
            <div class="botones" id="contenedor1">
                <!-- El SÍ responde de forma normal y avanza -->
                <button class="btn-si" onclick="siguientePregunta()">SÍ</button>
                <!-- El NO es el único que se escapa -->
                <button class="btn-no" id="btnNo1">NO</button>
            </div>
        </div>

        <!-- PREGUNTA 2 -->
        <div id="seccion2" class="hidden">
            <h1>¿Y tu familia lo sabe?</h1>
            <div class="botones" id="contenedor2">
                <!-- El SÍ es el único que se escapa -->
                <button class="btn-si" id="btnSi2">SÍ</button>
                <!-- El NO responde de forma normal y finaliza -->
                <button class="btn-no" onclick="finalizar()">NO</button>
            </div>
        </div>

        <!-- SECCIÓN FINAL -->
        <div id="seccionFinal" class="hidden">
            <h1 style="color: #27ae60; font-size: 2.2rem;">¡Felicidades saliste del closet!</h1>
            <button class="btn-si" onclick="location.reload()" style="margin-top: 20px;">Volver a jugar</button>
        </div>
    </div>

    <script>
        // Función para hacer que un botón se escape estrictamente dentro de los márgenes de la pantalla
        function configurarEscape(idBoton) {
            const btn = document.getElementById(idBoton);

            function mover(e) {
                if (e) e.preventDefault();
                
                const margen = 20;
                const anchoVentana = window.innerWidth;
                const altoVentana = window.innerHeight;
                
                const anchoBoton = btn.offsetWidth;
                const altoBoton = btn.offsetHeight;

                // Límites exactos del contorno de la ventana restando el tamaño del botón y un margen
                const maxX = anchoVentana - anchoBoton - margen;
                const maxY = altoVentana - altoBoton - margen;

                const randomX = Math.max(margen, Math.random() * maxX);
                const randomY = Math.max(margen, Math.random() * maxY);

                btn.classList.add('escapista');
                btn.style.left = `${randomX}px`;
                btn.style.top = `${randomY}px`;
            }

            btn.addEventListener('mouseover', mover);
            btn.addEventListener('touchstart', mover);
        }

        // --- ACTIVAR ESCAPE SOLO PARA EL BOTÓN "NO" DE LA PREGUNTA 1 ---
        configurarEscape('btnNo1');

        // --- TRANSICIÓN A LA SEGUNDA PREGUNTA ---
        function siguientePregunta() {
            document.getElementById('seccion1').classList.add('hidden');
            document.getElementById('seccion2').classList.remove('hidden');
            
            // --- ACTIVAR ESCAPE SOLO PARA EL BOTÓN "SÍ" DE LA PREGUNTA 2 ---
            configurarEscape('btnSi2');
        }

        // --- FINALIZACIÓN Y LANZAMIENTO DE SERPENTINAS ---
        function finalizar() {
            document.getElementById('seccion2').classList.add('hidden');
            document.getElementById('seccionFinal').classList.remove('hidden');

            // Lanzamiento de serpentinas y confeti masivo desde los costados
            var duration = 3.5 * 1000;
            var end = Date.now() + duration;

            (function frame() {
                confetti({
                    particleCount: 5,
                    angle: 60,
                    spread: 55,
                    origin: { x: 0 }
                });
                confetti({
                    particleCount: 5,
                    angle: 120,
                    spread: 55,
                    origin: { x: 1 }
                });

                if (Date.now() < end) {
                    requestAnimationFrame(frame);
                }
            }());
        }
    </script>

</body>
</html>
